<!doctype html><html lang="en"><meta charset="utf-8"><title>Popup observation fixture</title>
<style>body{padding:32px;font:16px system-ui}button,[role^="menuitem"],[role="option"]{padding:12px;margin:4px}#portal{position:absolute;top:160px;left:40px;background:#eee}#portal[hidden]{display:none}#background button{position:absolute;left:600px;top:80px}#noise{position:absolute;right:20px;top:20px}</style>
<h1>Popup observation fixture</h1><button id="account">Account</button><button id="close">Close menu</button><output id="counter">Actions: 0</output><p id="noise"></p><div id="background"></div><div id="portal" role="menu" aria-label="Account menu" hidden></div>
<script>
const params = new URLSearchParams(location.search);
const portal = document.getElementById('portal');
const markup = '<div role="menuitem" tabindex="0">Rename</div><div role="menuitemcheckbox" tabindex="0">Pin</div><div role="menuitemradio" tabindex="0">Plugins</div><div role="option" tabindex="0">Switch account</div><div role="menuitem" aria-disabled="true">Disabled</div><div role="menuitem" hidden>Hidden</div>';
const controls = params.has('custom') ? '<custom-control tabindex="0" style="display:block;padding:12px">Switch account</custom-control>' : markup;
if(params.has('preexisting')) portal.innerHTML = markup;
if(params.has('crowded')) document.getElementById('background').innerHTML='<button>Background</button>'.repeat(155);
let actions=0;
document.getElementById('account')[params.has('pointerdown') ? 'onpointerdown' : 'onclick']=()=>{
 const reveal=()=>{
  if(!portal.innerHTML) portal.innerHTML=controls;
  portal.hidden=false;
  if(params.has('animation')){portal.style.opacity='0';portal.style.transition='opacity 0.6s';requestAnimationFrame(()=>requestAnimationFrame(()=>portal.style.opacity='1'));}
 };
 if(params.has('pointerdown')) reveal(); else setTimeout(reveal,params.has('delayed')?2300:0);
};
document.getElementById('close').onclick=()=>portal.hidden=true;
portal.onclick=event=>{if(event.target.textContent==='Switch account')document.getElementById('counter').textContent=`Actions: ${++actions}`;};
setInterval(()=>document.getElementById('noise').textContent=String(Date.now()),50);
</script></html>
