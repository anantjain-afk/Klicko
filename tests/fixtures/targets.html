<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClickPilot target validation fixture</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 32px; font: 16px/1.5 system-ui, sans-serif; }
      #toolbar { margin: 60px 0; padding: 24px; width: max-content; background: #eee; pointer-events: none; }
      #target { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px;
        padding: 0; border: 0; border-radius: 8px; background: #b8d3c3; pointer-events: auto; }
      #target svg { width: 20px; height: 20px; }
      #cover { display: none; position: fixed; z-index: 10; background: #a65d46; }
      .tools { display: flex; flex-wrap: wrap; gap: 12px; max-width: 650px; margin-top: 32px; }
      button, select { font: inherit; }
    </style>
  </head>
  <body>
    <h1>Target validation</h1>
    <p>Highlight Primary target. The icon is nested SVG; its rounded corners are outside its clickable shape.</p>
    <div id="toolbar">
      <button id="target" aria-label="Primary target"><svg viewBox="0 0 20 20" aria-hidden="true"><g><path d="M0 0H20V20H0Z" /></g></svg></button>
    </div>
    <output id="counter">Clicks: 0</output>
    <div class="tools">
      <label>Shape <select id="shape">
        <option value="rounded">Rounded</option>
        <option value="asymmetric">Asymmetric ellipses</option>
        <option value="one-corner">One large corner</option>
        <option value="overlapping">Overlapping asymmetric radii</option>
        <option value="pill">Pill</option>
        <option value="square">Square</option>
      </select></label>
      <button id="cover-full">Cover target</button>
      <button id="cover-top">Cover top edge</button>
      <button id="cover-right">Cover right edge</button>
      <button id="cover-bottom">Cover bottom edge</button>
      <button id="cover-left">Cover left edge</button>
      <button id="cover-corner">Cover rounded corner</button>
      <button id="uncover">Uncover target</button>
      <button id="replace">Replace target node</button>
    </div>
    <div id="cover"></div>
    <script>
      let clicks = 0;
      document.getElementById('toolbar').addEventListener('click', (event) => {
        if (event.target instanceof Element && event.target.closest('#target')) {
          document.getElementById('counter').textContent = `Clicks: ${++clicks}`;
        }
      });
      document.getElementById('shape').onchange = (event) => {
        const target = document.getElementById('target');
        const shape = event.target.value;
        target.style.width = shape === 'rounded' || shape === 'square' ? '36px' : '100px';
        target.style.height = ['asymmetric', 'one-corner', 'overlapping'].includes(shape) ? '60px' : '36px';
        target.style.borderRadius = shape === 'asymmetric' ? '70% 5% 30% 10% / 60% 15% 50% 20%'
          : shape === 'one-corner' ? '100% 0 0 0'
          : shape === 'overlapping' ? '120px 80px 20px 40px / 70px 30px 50px 20px'
          : shape === 'pill' ? '999px' : shape === 'square' ? '0' : '8px';
      };
      for (const side of ['full', 'top', 'right', 'bottom', 'left', 'corner']) {
        document.getElementById(`cover-${side}`).onclick = () => {
          const r = document.getElementById('target').getBoundingClientRect();
          const patch = side === 'top' ? [r.x + r.width / 2 - 2, r.y, 4, 6]
            : side === 'right' ? [r.right - 6, r.y + r.height / 2 - 2, 6, 4]
            : side === 'bottom' ? [r.x + r.width / 2 - 2, r.bottom - 6, 4, 6]
            : side === 'left' ? [r.x, r.y + r.height / 2 - 2, 6, 4]
            : side === 'corner' ? [r.x + 3, r.y + 3, 4, 4] : [r.x, r.y, r.width, r.height];
          Object.assign(document.getElementById('cover').style, {
            display: 'block', left: `${patch[0]}px`, top: `${patch[1]}px`, width: `${patch[2]}px`, height: `${patch[3]}px`,
          });
        };
      }
      document.getElementById('uncover').onclick = () => { document.getElementById('cover').style.display = 'none'; };
      document.getElementById('replace').onclick = () => {
        const target = document.getElementById('target');
        target.replaceWith(target.cloneNode(true));
      };
    </script>
  </body>
</html>
